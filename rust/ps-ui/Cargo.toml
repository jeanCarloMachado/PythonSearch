[package]
name = "ps-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ps_ui"
path = "src/main.rs"

[[bin]]
name = "register_new_rust"
path = "src/bin/register.rs"

[dependencies]
ps-core = { path = "../ps-core" }
ps-mac = { path = "../ps-mac" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs.workspace = true
raw-window-handle = "0.6"

# eframe is built without default features, which drops winit's Linux windowing backends.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11"] }
