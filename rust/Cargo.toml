[workspace]
resolver = "2"
members = ["ps-core", "ps-mac", "ps-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# egui-winit ignores the Super key on Linux; the vendored copy maps it to `command` so the
# macOS ⌘ shortcuts in ps-ui work with Super. See vendor/egui-winit/src/lib.rs (ModifiersChanged).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
